name: Deploy Frontend

on:
  push:
    branches:
      - main
      - beta

jobs:
  deploy-production:
    name: Deploy Production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            echo "--- Pulling latest code ---"
            cd /var/www/tripme/Tripme-Frontend
            git pull origin main
            echo "--- Installing dependencies ---"
            npm ci
            echo "--- Building Next.js app ---"
            npm run build
            echo "--- Restarting server ---"
            pm2 reload frontend --update-env
            pm2 save
            echo "--- Production deploy complete ---"

  deploy-beta:
    name: Deploy Beta
    if: github.ref == 'refs/heads/beta'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            echo "--- Pulling latest beta code ---"
            cd /var/www/tripme/Tripme-Frontend-Beta
            git pull origin beta
            echo "--- Installing dependencies ---"
            npm ci
            echo "--- Building Next.js app ---"
            npm run build
            echo "--- Restarting beta server ---"
            if pm2 list | grep -q "frontend-beta"; then
              pm2 reload frontend-beta --update-env
            else
              PORT=3001 pm2 start npm --name frontend-beta -- start
            fi
            pm2 save
            echo "--- Beta deploy complete ---"
